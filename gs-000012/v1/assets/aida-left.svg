<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" fill="none"><style>text{font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif} .serif{font-family:'Hiragino Mincho ProN','Yu Mincho',serif}</style><rect width="420" height="560" fill="#f4f0e6"/><text x="30" y="43" fill="#191917" font-size="12">あいだの設計</text><path d="M30 60h360" stroke="#191917"/><text class="serif" x="22" y="357" fill="#191917" font-size="292">間</text><rect x="195" y="149" width="61" height="151" fill="#dd3d27"/><circle cx="226" cy="202" r="34" fill="#f4f0e6"/><text x="30" y="412" fill="#191917" font-size="16">余白は、読む順序になる。</text><text x="30" y="446" fill="#191917" font-size="12">大きさと距離を変えることで、</text><text x="30" y="466" fill="#191917" font-size="12">一つの言葉の印象が変わる。</text><text x="30" y="486" fill="#191917" font-size="12">紙面の間を探る、編集の研究。</text><path d="M30 515h360" stroke="#191917"/><text x="30" y="541" fill="#191917" font-size="12">Intervals / Editorial study</text><text x="375" y="541" fill="#191917" font-size="12">02</text></svg>