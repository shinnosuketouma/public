<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560"><style>text{font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}.serif{font-family:'Hiragino Mincho ProN','Yu Mincho',serif}</style><rect width="420" height="560" fill="#f4f0e6"/><text x="25" y="35" font-size="13" fill="#181816">あいだの設計 / 01</text><path d="M25 52h370" stroke="#181816"/><text x="22" y="105" class="serif" font-size="40" fill="#181816" letter-spacing="-2">入口を、</text><text x="22" y="153" class="serif" font-size="40" fill="#181816" letter-spacing="-2">ひとつにする。</text><text x="25" y="190" font-size="16" fill="#181816">すべてを大きくすると、読む順序がなくなる。</text><text x="25" y="231" font-size="13" fill="#181816">一枚のポスターに、企画名、説明、日時、会場、参加方法を</text><text x="25" y="253" font-size="13" fill="#181816">並べる。どれも必要な情報でも、同じ強さでは読む人が入口</text><text x="25" y="275" font-size="13" fill="#181816">を選ばなければならない。</text><text x="25" y="325" font-size="13" fill="#181816">このノートの読む順序</text><path d="M25 336h370" stroke="#b1afa5"/><text x="25" y="353" font-size="13" fill="#e85039">01</text><text x="65" y="353" font-size="14" fill="#181816">見つける</text><text x="168" y="353" font-size="12" fill="#181816">見出しで、何の話かを知る</text><path d="M25 366h370" stroke="#b1afa5"/><text x="25" y="383" font-size="13" fill="#e85039">02</text><text x="65" y="383" font-size="14" fill="#181816">読む</text><text x="168" y="383" font-size="12" fill="#181816">要点から、考え方をたどる</text><path d="M25 396h370" stroke="#b1afa5"/><text x="25" y="413" font-size="13" fill="#e85039">03</text><text x="65" y="413" font-size="14" fill="#181816">持ち帰る</text><text x="168" y="413" font-size="12" fill="#181816">自分の企画へ問いを移す</text><path d="M25 517h370" stroke="#181816"/><text x="25" y="541" font-size="12" fill="#181816">伝える順序のつくり方</text><text x="376" y="541" font-size="12" fill="#181816">02</text></svg>