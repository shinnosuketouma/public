<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560"><style>text{font-family:Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}.serif{font-family:'Hiragino Mincho ProN','Yu Mincho',serif}</style><rect width="420" height="560" fill="#f4f0e6"/><text x="25" y="35" font-size="13" fill="#181816">あいだの設計 / 02</text><path d="M25 52h370" stroke="#181816"/><text x="22" y="105" class="serif" font-size="40" fill="#181816" letter-spacing="-2">読む距離で、</text><text x="22" y="153" class="serif" font-size="40" fill="#181816" letter-spacing="-2">情報を分ける。</text><text x="25" y="190" font-size="16" fill="#181816">同じ原稿を、同じ大きさで使わない。</text><text x="25" y="231" font-size="13" fill="#181816">通りすがりに見る人と、手元で読む人。同じ内容でも、読む</text><text x="25" y="253" font-size="13" fill="#181816">距離によって必要な順序は変わる。遠くでは企画の輪郭を、</text><text x="25" y="275" font-size="13" fill="#181816">近くでは中身を、手元では次の行動を渡したい。</text><text x="25" y="325" font-size="13" fill="#181816">一つの企画、三つの読む距離</text><path d="M25 336h370" stroke="#b1afa5"/><text x="25" y="353" font-size="13" fill="#e85039">01</text><text x="65" y="353" font-size="14" fill="#181816">遠くから</text><text x="168" y="353" font-size="12" fill="#181816">何の企画か</text><path d="M25 366h370" stroke="#b1afa5"/><text x="25" y="383" font-size="13" fill="#e85039">02</text><text x="65" y="383" font-size="14" fill="#181816">近づいて</text><text x="168" y="383" font-size="12" fill="#181816">どんな内容か</text><path d="M25 396h370" stroke="#b1afa5"/><text x="25" y="413" font-size="13" fill="#e85039">03</text><text x="65" y="413" font-size="14" fill="#181816">手元で</text><text x="168" y="413" font-size="12" fill="#181816">どう参加するか</text><path d="M25 517h370" stroke="#181816"/><text x="25" y="541" font-size="12" fill="#181816">伝える順序のつくり方</text><text x="376" y="541" font-size="12" fill="#181816">03</text></svg>